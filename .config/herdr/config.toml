onboarding = false

[keys]
prefix = ["ctrl+space", "ctrl+b"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
next_workspace = "cmd+j"
previous_workspace = "cmd+k"
new_tab = ["prefix+c", "cmd+t"]
new_workspace = ["prefix+shift+n", "cmd+n"]
close_workspace = "prefix+shift+d"
clear_pane = "prefix+cmd+k"

[[keys.command]]
key = "cmd+shift+n"
type = "shell"
command = "~/.config/herdr/new-workspace.sh"
description = "new workspace with claude, diff, and shell tabs"

[[keys.command]]
key = "cmd+shift+b"
type = "popup"
command = "~/.config/herdr/new-worktree.sh"
description = "new worktree with claude, diff, and shell tabs"
width = 60
height = 8

[[keys.command]]
key = "cmd+shift+s"
type = "shell"
command = "~/.config/herdr/start-servers.sh"
description = "servers tab with rails, sidekiq, and the webpack dev server"

[[keys.command]]
key = "cmd+shift+j"
type = "shell"
command = "~/.config/herdr/move-workspace.sh down"
description = "move workspace down"

[[keys.command]]
key = "cmd+shift+k"
type = "shell"
command = "~/.config/herdr/move-workspace.sh up"
description = "move workspace up"

[[keys.command]]
key = "cmd+shift+x"
type = "popup"
command = "~/.config/herdr/close-workspace.sh"
description = "close workspace, optionally deleting its worktree"
width = 70
height = 12

# Ghostty inherits the environment it's opened from, and the HERDR_* variables would make its shells look like
# they're inside herdr.
[[keys.command]]
key = "prefix+cmd+n"
type = "shell"
command = "env $(env | sed -n 's/^\\(HERDR_[A-Z_]*\\)=.*/-u \\1/p') open -na Ghostty.app"
description = "open a normal Ghostty window"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
window_title = "herdr: {workspace}"
status_indicators = "symbols"
copy_on_select = false
prompt_new_tab_name = false
